services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlc
      POSTGRES_PASSWORD: mlc
      POSTGRES_DB: mlc
    ports:
      -"5444:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlc -d mlc"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://mlc:mlc@db:5432/mlc
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: .
    command: ["python", "-m", "app.bot"]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://mlc:mlc@db:5432/mlc
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Permanent HTTPS address through Cloudflare Tunnel.
  # Start with: docker compose --profile tunnel up --build
  # In the Cloudflare dashboard, point the tunnel's public hostname to http://api:8000
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  db-data:
