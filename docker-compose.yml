services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlc
      POSTGRES_PASSWORD: mlc
      POSTGRES_DB: mlc
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://mlc:mlc@db:5432/mlc
    ports:
      - "8000:8000"
    depends_on:
      - db

  bot:
    build: .
    command: ["python", "-m", "app.bot"]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://mlc:mlc@db:5432/mlc
    depends_on:
      - api

  # Permanent HTTPS address through Cloudflare Tunnel.
  # Start with: docker compose --profile tunnel up --build
  # In the Cloudflare dashboard, point the tunnel's public hostname to http://api:8000
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api
    profiles:
      - tunnel

volumes:
  db-data:
